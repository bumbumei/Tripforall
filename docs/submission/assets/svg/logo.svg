<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 동그란 배경 (3세대를 하나로) -->
  <circle cx="180" cy="180" r="130" fill="url(#brandGrad)" filter="url(#softShadow)"/>

  <!-- 손주 (작은 사람) -->
  <g transform="translate(120 165)">
    <circle cx="0" cy="0" r="14" fill="white"/>
    <rect x="-9" y="14" width="18" height="36" rx="6" fill="white"/>
  </g>

  <!-- 어머니 (중간 키) -->
  <g transform="translate(180 145)">
    <circle cx="0" cy="0" r="18" fill="white"/>
    <rect x="-12" y="18" width="24" height="52" rx="8" fill="white"/>
  </g>

  <!-- 할머니 + 휠체어 -->
  <g transform="translate(245 175)">
    <!-- 사람 -->
    <circle cx="0" cy="-10" r="14" fill="white"/>
    <rect x="-10" y="4" width="20" height="30" rx="6" fill="white"/>
    <!-- 휠체어 큰 바퀴 -->
    <circle cx="-2" cy="48" r="18" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="-2" cy="48" r="6" fill="white"/>
    <!-- 등받이 라인 -->
    <line x1="10" y1="0" x2="10" y2="48" stroke="white" stroke-width="3"/>
    <!-- 작은 바퀴 -->
    <circle cx="20" cy="55" r="8" fill="none" stroke="white" stroke-width="2.5"/>
  </g>

  <!-- 텍스트 -->
  <text x="360" y="175" font-family="'Malgun Gothic', sans-serif" font-size="84" font-weight="800" fill="#1565C0">함께걸음</text>
  <text x="360" y="220" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#1976D2">TripForAll</text>
  <text x="360" y="270" font-family="'Malgun Gothic', sans-serif" font-size="20" fill="#666">이동약자·다세대 가족 동반 여행 AI 어시스턴트</text>
</svg>
